<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div class="product_card">
      <div class="product_card_box">
        <img
          class="product_card_image"
          src="../src/images/imac.jpeg"
          alt="productImage"
        />

        <span class="product_card_name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </span>
        <span class="product_card_code">Product code: 195434</span>

        <div class="product_card_rate">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <span class="reviews">Reviews: 5</span>
        </div>

        <div class="product_card_price">
          <div class="price_txt">Price:</div>
          <div class="price_numb">$2,199</div>
        </div>

        <button class="buy_button">BUY</button>
      </div>
    </div>
  </body>
</html>
